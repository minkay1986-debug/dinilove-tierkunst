name: DiniLove Admin API tests

on:
  push:
    branches:
      - feature/admin-security-foundation-2026-10-25
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  admin-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run admin API smoke tests
        run: node --experimental-default-type=module --test tests/admin-api.test.mjs
